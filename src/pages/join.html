<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join Us | YKC Programming Club</title>
  <link rel="stylesheet" href="../styles/base.css" />
  <link rel="stylesheet" href="../styles/layout.css" />
  <link rel="stylesheet" href="../styles/components.css" />
</head>
<body>
  <header class="site-header">
    <div class="container nav-bar">
      <a href="../../index.html" class="brand">&lt;YKC_ProgrammingClub&gt;</a>
      <nav aria-label="Main navigation">
        <ul class="nav-links">
          <li><a href="../../index.html">Home</a></li>
          <li><a href="projects.html">Projects</a></li>
          <li><a href="members.html">Members</a></li>
          <li><a href="resources.html">Resources</a></li>
          <li><a href="faq.html">FAQ</a></li>
          <li><a href="join.html" class="active">Join Us</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-header">
      <div class="container">
        <h1>Join the Programming Club</h1>
        <p>Tell us a bit about yourself and what you'd like to build or learn.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <!-- Deona: Web3Forms endpoint and form integration -->
        <form class="card form-card" action="https://api.web3forms.com/submit" method="POST">
          <!-- Replace WEB3FORMS_ACCESS_KEY with public Web3Forms key later -->
          <input type="hidden" name="access_key" value="WEB3FORMS_ACCESS_KEY" />
          <input type="hidden" name="subject" value="New Programming Club Application" />

          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required />
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required />
          </div>

          <div class="form-group">
            <label for="experience">Programming Experience</label>
            <select id="experience" name="experience" required>
              <option value="none">None yet (Complete beginner)</option>
              <option value="beginner">Some basics (HTML/CSS/Python/etc.)</option>
              <option value="intermediate">Built a few projects before</option>
            </select>
          </div>

          <div class="form-group">
            <label for="motivation">Interests &amp; Why You Want to Join</label>
            <textarea id="motivation" name="motivation" rows="4" required></textarea>
          </div>

          <button type="submit" class="btn btn-primary">Submit Application</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>YKC Programming Club</span>
      <a href="https://github.com/YKC-ProgrammingClub/ProgrammingClub-Website" target="_blank" rel="noopener">GitHub Repository</a>
    </div>
  </footer>
</body>
</html>
